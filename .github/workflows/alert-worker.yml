name: Alert worker

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jobbbler-alert-worker
  cancel-in-progress: false

jobs:
  run-alert-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: production
      JOBBBLER_WORKER_MODE: alert_once
      JOBBBLER_SOURCE_LIMIT: 50
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PUBLIC_BASE_URL: ${{ secrets.PUBLIC_BASE_URL }}
      NOTIFICATION_DRIVER: resend
      PII_ENCRYPTION_KEY: ${{ secrets.PII_ENCRYPTION_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.19.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @jobbbler/worker build
      - run: pnpm --filter @jobbbler/worker start
